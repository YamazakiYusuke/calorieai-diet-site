<html lang="ja">

  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }

    main { box-sizing: border-box; max-width: 760px; min-height: 100vh; margin: auto; padding: 64px 24px; }
    .card { padding: 40px; border: 1px solid #dfe3e8; border-radius: 20px; background: #fff; box-shadow: 0 8px 28px rgb(0 0 0 / 6%); }
    h1 { margin-top: 0; font-size: 2rem; }
    p { line-height: 1.8; }
    a { color: #1769aa; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      body { background: #121416; color: #edf0f2; }
      .card { border-color: #363b40; background: #1d2023; }
      a { color: #8bc4ff; }
    }

<body>
  <main>
